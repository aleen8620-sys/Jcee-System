<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة الإدارة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --brand:#0d5a92; --brand-ink:#fff; --brand-soft:#e4f0fa;
    --bg:#eef3f7; --panel:#fff; --panel2:#f6fafc;
    --line:#d8e5ee; --ink:#0a2c47; --ink2:#3d6483; --ink3:#7191aa;
    --good:#146b4f; --good-soft:#dcf1e7;
    --bad:#96331f;  --bad-soft:#fbe4dd;
    --warn:#8a5510; --warn-soft:#fbeedb;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"IBM Plex Sans Arabic",system-ui,Tahoma,sans-serif;font-size:15px;line-height:1.7}
  .wrap{max-width:1100px;margin-inline:auto;
        padding-left:max(14px,env(safe-area-inset-left,0px));
        padding-right:max(14px,env(safe-area-inset-right,0px));
        padding-block:16px 48px}

  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
       background:var(--panel);border:1px solid var(--line);
       border-radius:14px;padding:12px 16px;margin-bottom:12px}
  .top .who{font-size:13.5px;color:var(--ink2)}
  .top .who b{color:var(--ink)}
  .top .sp{margin-inline-start:auto}
  .role{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;
        background:var(--brand-soft);color:var(--brand)}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
  .tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);
    border-radius:999px;padding:7px 15px;font:inherit;font-size:13.5px;
    font-weight:600;color:var(--ink3);cursor:pointer}
  .tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:16px;margin-bottom:12px}
  .card h2{margin:0 0 12px;font-size:16px;font-weight:700}
  .card h2 small{font-weight:500;color:var(--ink3);font-size:12.5px}

  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:10px 0 5px}
  .inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
       background:var(--panel);color:var(--ink);font:inherit;font-size:15px}
  .inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  select.inp{cursor:pointer}

  .btn{border:0;border-radius:10px;padding:10px 18px;background:var(--brand);
       color:var(--brand-ink);font:inherit;font-size:14.5px;font-weight:700;cursor:pointer}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.g{background:var(--panel);color:var(--ink2);border:1px solid var(--line)}
  .btn.g:hover{border-color:var(--brand);color:var(--ink)}
  .btn.d{background:var(--bad)}
  .btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
  .btn.w{width:100%;margin-top:14px;padding:13px}

  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
  .tile .k{font-size:12px;color:var(--ink3);font-weight:600}
  .tile .v{font-size:27px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
  .tile .s{font-size:11.5px;color:var(--ink3)}

  .msg{border-radius:10px;padding:11px 14px;font-size:14px;margin-top:12px;border-inline-start:3px solid}
  .msg.e{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
  .msg.g{background:var(--good-soft);border-color:var(--good);color:var(--good)}
  .msg.w{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}

  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:start;font-size:11px;letter-spacing:.05em;color:var(--ink3);
     font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid var(--panel2);color:var(--ink2);white-space:nowrap}
  tr:last-child td{border-bottom:0}
  td b{color:var(--ink);font-weight:600}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;unicode-bidi:isolate}
  .num{font-variant-numeric:tabular-nums}

  .chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600}
  .chip.g{background:var(--good-soft);color:var(--good)}
  .chip.n{background:var(--panel2);color:var(--ink3);border:1px solid var(--line)}
  .chip.w{background:var(--warn-soft);color:var(--warn)}
  .chip.d{background:var(--bad-soft);color:var(--bad)}

  .gatein{width:100%;text-align:center;font-size:42px;font-weight:700;letter-spacing:10px;
    direction:ltr;padding:16px;border:2px solid var(--line);border-radius:14px;
    font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace}
  .gatein:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
  .gateres{border-radius:13px;padding:18px;text-align:center;margin-top:14px}
  .gateres.ok{background:var(--good-soft);color:var(--good)}
  .gateres.no{background:var(--bad-soft);color:var(--bad)}
  .gateres.al{background:var(--warn-soft);color:var(--warn)}
  .gateres .big{font-size:21px;font-weight:700}
  .gateres .sm{font-size:13.5px;margin-top:3px;opacity:.9}

  .empty{padding:28px;text-align:center;color:var(--ink3);font-size:13.5px}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);
    border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;
    vertical-align:-3px;margin-inline-end:7px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  .hint{font-size:11.5px;color:var(--ink3);margin-top:4px}
  a{color:var(--brand)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card"><span class="spin"></span> جارٍ التحميل…</div></div>

<script>
var SUPA_URL = "https://wozvvtyurxipbejwczwc.supabase.co";
var SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvenZ2dHl1cnhpcGJlandjendjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MjE1MjksImV4cCI6MjEwODQ5NzUyOX0.A3pdCqtMv2Zf3c13ZLZwi8_XdOId_4EIm6BXKifI-aI";

var sb  = supabase.createClient(SUPA_URL, SUPA_KEY);
var app = document.getElementById("app");
var $   = function(s){ return document.querySelector(s); };

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function money(h){ var r=(h||0)/100; return (r%1===0?r.toFixed(0):r.toFixed(2)); }
function dt(s){ if(!s) return "—"; try{ return new Date(s).toLocaleString("ar-SA",
  {dateStyle:"short",timeStyle:"short"}); }catch(e){ return s; } }

var CATS   = {visitor:"زائر",exhibitor:"عارض",media:"إعلامي",vip:"كبار الشخصيات"};
var ROLES  = {owner:"مالك",admin:"مدير",staff:"موظف",gate:"بوابة"};
var STATUS = {pending:["بانتظار الدفع","w"],paid:["مدفوع","g"],free:["مجاني","n"],
              failed:["فشل","d"],refunded:["مُسترجع","n"]};

var S = { me:null, staff:null, events:[], ev:null, tab:"gate", msg:"", err:"" };

// ===================== الدخول =====================
function loginView(err){
  app.innerHTML =
   '<div class="card" style="max-width:420px;margin:40px auto">' +
   '<h2>دخول الموظفين</h2>' +
   (err ? '<div class="msg e">'+esc(err)+'</div>' : '') +
   '<form id="lf">' +
   '<label for="le">البريد الإلكتروني</label>' +
   '<input class="inp" id="le" type="email" required autocomplete="username">' +
   '<label for="lp">كلمة المرور</label>' +
   '<input class="inp" id="lp" type="password" required autocomplete="current-password">' +
   '<button class="btn w" type="submit">دخول</button>' +
   '</form></div>';
  $("#lf").addEventListener("submit", async function(e){
    e.preventDefault();
    var b = e.target.querySelector("button");
    b.disabled = true; b.textContent = "جارٍ الدخول…";
    var r = await sb.auth.signInWithPassword({ email:$("#le").value.trim(), password:$("#lp").value });
    if (r.error){
      var m = r.error.message || "خطأ غير معروف";
      var st = r.error.status ? (" [" + r.error.status + "]") : "";
      if (/invalid login credentials/i.test(m))      m = "البريد أو كلمة المرور غير صحيحة";
      else if (/email not confirmed/i.test(m))       m = "البريد غير مُفعّل";
      else if (/database error/i.test(m))            m = "خطأ في قاعدة البيانات — صفّ المستخدم ناقص";
      else if (/failed to fetch|network/i.test(m))   m = "تعذّر الاتصال بالخادم";
      loginView(m + st + "  ·  " + (r.error.message || ""));
      return;
    }
    boot();
  });
}

// ===================== الهيكل =====================
var TABS = [
  {k:"gate",    t:"البوابة"},
  {k:"list",    t:"الزوار"},
  {k:"quick",   t:"تسجيل سريع"},
  {k:"rep",     t:"التقارير"},
  {k:"tickets", t:"التذاكر", admin:true},
  {k:"events",  t:"المعارض", admin:true},
  {k:"staff",   t:"الموظفون", owner:true}
];

function isAdmin(){ return S.staff && (S.staff.role==="owner" || S.staff.role==="admin"); }
function isOwner(){ return S.staff && S.staff.role==="owner"; }

function shell(inner){
  var tabs = TABS.filter(function(t){
    if (t.owner) return isOwner();
    if (t.admin) return isAdmin();
    return true;
  }).map(function(t){
    return '<button data-tab="'+t.k+'" aria-pressed="'+(S.tab===t.k?"true":"false")+'">'+t.t+'</button>';
  }).join("");

  var evs = S.events.map(function(e){
    return '<option value="'+esc(e.slug)+'"'+(S.ev===e.slug?" selected":"")+'>'+esc(e.name_ar)+'</option>';
  }).join("");

  app.innerHTML =
    '<div class="top">' +
      '<div class="who">' + esc(S.staff ? (S.staff.full_name||"") : "") +
        ' <span class="role">' + esc(ROLES[S.staff?S.staff.role:""]||"") + '</span></div>' +
      '<div class="sp"></div>' +
      (S.events.length ? '<select class="inp" id="evsel" style="width:auto;min-width:180px">'+evs+'</select>' : '') +
      '<button class="btn g sm" id="out">خروج</button>' +
    '</div>' +
    '<div class="tabs">' + tabs + '</div>' +
    (S.err ? '<div class="msg e">'+esc(S.err)+'</div>' : '') +
    (S.msg ? '<div class="msg g">'+esc(S.msg)+'</div>' : '') +
    inner;

  document.querySelectorAll("[data-tab]").forEach(function(b){
    b.onclick = function(){ S.tab=b.getAttribute("data-tab"); S.msg=""; S.err=""; route(); };
  });
  $("#out").onclick = async function(){ await sb.auth.signOut(); location.reload(); };
  var sel = $("#evsel");
  if (sel) sel.onchange = function(){ S.ev = sel.value; S.msg=""; S.err=""; route(); };
}

function loading(){ shell('<div class="card"><span class="spin"></span> جارٍ التحميل…</div>'); }

// ===================== البوابة =====================
function gateView(res){
  var r = "";
  if (res){
    if (res.ok) r = '<div class="gateres ok"><div class="big">✓ دخول مسجّل</div>' +
      '<div class="sm">'+esc(res.name)+' · '+esc(CATS[res.category]||res.category)+
      (res.company?' · '+esc(res.company):'')+'</div></div>';
    else if (res.error==="already") r = '<div class="gateres al"><div class="big">سبق تسجيل دخوله</div>' +
      '<div class="sm">'+esc(res.name)+' · '+dt(res.at)+'</div></div>';
    else if (res.error==="not_found") r = '<div class="gateres no"><div class="big">الرمز غير موجود</div></div>';
    else if (res.error==="bad_code") r = '<div class="gateres no"><div class="big">الرمز يتكوّن من ٨ أرقام</div></div>';
    else r = '<div class="gateres no"><div class="big">تعذّر التحقق</div></div>';
  }
  shell('<div class="card"><h2>البوابة الإلكترونية <small>اكتب الرمز أو امسحه بقارئ QR</small></h2>' +
    '<form id="gf"><input class="gatein" id="gc" maxlength="8" inputmode="numeric" ' +
    'placeholder="00000000" autocomplete="off" autofocus>' +
    '<button class="btn w" type="submit">تسجيل الدخول</button></form>' + r + '</div>');

  var inp = $("#gc"); if (inp) inp.focus();
  $("#gf").onsubmit = async function(e){
    e.preventDefault();
    var code = $("#gc").value.replace(/\D/g,"");
    if (!code) return;
    var r2 = await sb.rpc("do_checkin", { p_code: code });
    gateView(r2.data || {ok:false});
  };
  // القارئ يكتب ٨ أرقام ثم Enter — نرسل تلقائياً عند اكتمالها
  if (inp) inp.oninput = function(){
    if (inp.value.replace(/\D/g,"").length === 8) $("#gf").requestSubmit();
  };
}

// ===================== الزوار =====================
var Q = "";
async function listView(){
  loading();
  var ev = S.events.filter(function(e){ return e.slug===S.ev; })[0];
  if (!ev){ shell('<div class="card"><div class="empty">اختر معرضاً</div></div>'); return; }

  var q = sb.from("visitors").select("*").eq("event_id", ev.id)
            .order("created_at",{ascending:false}).limit(300);
  if (Q){
    var t = Q.replace(/'/g,"");
    q = q.or("name.ilike.%"+t+"%,phone.ilike.%"+t+"%,code.ilike.%"+t+"%,company.ilike.%"+t+"%");
  }
  var r = await q;
  var rows = r.data || [];

  var body = rows.length ? rows.map(function(v){
    return '<tr><td class="mono">'+esc(v.code)+'</td>' +
      '<td><b>'+esc(v.name)+'</b></td>' +
      '<td class="mono">'+esc(v.phone)+'</td>' +
      '<td>'+esc(v.company||"—")+'</td>' +
      '<td><span class="chip n">'+esc(CATS[v.category]||v.category)+'</span></td>' +
      '<td>'+(v.source==="onsite"?'<span class="chip w">الكاونتر</span>':'<span class="chip n">إلكتروني</span>')+'</td>' +
      '<td>'+(v.checked_in_at?'<span class="chip g">حضر</span>':'<span class="chip n">لم يحضر</span>')+'</td>' +
      '<td><a class="btn g sm" href="badge.html?code='+encodeURIComponent(v.code)+'" target="_blank">باج</a></td>' +
      '</tr>';
  }).join("") : '';

  shell('<div class="card"><h2>الزوار <small>'+rows.length+' صف</small></h2>' +
    '<div class="row"><input class="inp" id="sq" style="flex:1;min-width:200px" ' +
    'placeholder="ابحث بالاسم أو الجوال أو الرمز أو الجهة" value="'+esc(Q)+'">' +
    '<button class="btn g" id="csv">تصدير CSV</button></div>' +
    (body ? '<div class="scroll" style="margin-top:12px"><table><tr>' +
      '<th>الرمز</th><th>الاسم</th><th>الجوال</th><th>الجهة</th><th>الفئة</th>' +
      '<th>المصدر</th><th>الحضور</th><th></th></tr>'+body+'</table></div>'
      : '<div class="empty">لا توجد نتائج</div>') + '</div>');

  var sq = $("#sq");
  var tmr; sq.oninput = function(){ clearTimeout(tmr); tmr = setTimeout(function(){
    Q = sq.value.trim(); listView(); }, 400); };
  $("#csv").onclick = function(){ exportCsv(rows, ev.name_ar); };
}

function exportCsv(rows, evname){
  var head = ["الرمز","الاسم","الجوال","البريد","الجهة","المسمى","الفئة","المصدر","الحضور","وقت الدخول","التسجيل"];
  var lines = [head.join(",")];
  rows.forEach(function(v){
    lines.push([v.code,v.name,v.phone,v.email||"",v.company||"",v.job_title||"",
      CATS[v.category]||v.category, v.source==="onsite"?"الكاونتر":"إلكتروني",
      v.checked_in_at?"حضر":"لم يحضر", v.checked_in_at||"", v.created_at||""]
      .map(function(x){ return '"'+String(x==null?"":x).replace(/"/g,'""')+'"'; }).join(","));
  });
  // BOM ليفتح Excel العربية صحيحة
  var blob = new Blob(["﻿"+lines.join("\r\n")], {type:"text/csv;charset=utf-8;"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "visitors-"+(evname||"event")+".csv";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
}

// ===================== تسجيل سريع =====================
function quickView(){
  shell('<div class="card" style="max-width:460px"><h2>تسجيل سريع <small>للزائر الحاضر بلا تسجيل مسبق</small></h2>' +
    '<form id="qf"><label for="qn">الاسم الكامل</label><input class="inp" id="qn" required>' +
    '<label for="qp">رقم الجوال</label><input class="inp" id="qp" inputmode="numeric" placeholder="5xxxxxxxx" required>' +
    '<button class="btn w" type="submit">تسجيل وإصدار الرمز</button></form><div id="qr"></div></div>');

  $("#qf").onsubmit = async function(e){
    e.preventDefault();
    var b = e.target.querySelector("button"); b.disabled = true; b.textContent="جارٍ…";
    var r = await sb.rpc("quick_register", { p_event_slug:S.ev, p_name:$("#qn").value, p_phone:$("#qp").value });
    var d = r.data || {};
    b.disabled = false; b.textContent = "تسجيل وإصدار الرمز";
    var out = $("#qr");
    if (d.ok){
      out.innerHTML = '<div class="gateres ok"><div class="big mono">'+esc(d.code)+'</div>' +
        '<div class="sm">'+esc(d.name)+'</div></div>' +
        '<a class="btn g w" style="display:block;text-align:center;text-decoration:none" ' +
        'href="badge.html?code='+encodeURIComponent(d.code)+'" target="_blank">طباعة الباج</a>';
      $("#qn").value=""; $("#qp").value=""; $("#qn").focus();
    } else if (d.error==="duplicate"){
      out.innerHTML = '<div class="msg w">مسجّل مسبقاً — رمزه: <b class="mono">'+esc(d.code)+'</b></div>';
    } else {
      out.innerHTML = '<div class="msg e">'+esc(d.error==="bad_phone"?"رقم الجوال غير صحيح":
        d.error==="bad_name"?"الاسم قصير":"تعذّر التسجيل")+'</div>';
    }
  };
}

// ===================== التقارير =====================
async function repView(){
  loading();
  var ev = S.events.filter(function(e){ return e.slug===S.ev; })[0];
  if (!ev){ shell('<div class="card"><div class="empty">اختر معرضاً</div></div>'); return; }

  var r = await sb.from("visitors").select("category,source,checked_in_at").eq("event_id", ev.id);
  var v = r.data || [];
  var total = v.length;
  var att   = v.filter(function(x){ return x.checked_in_at; }).length;
  var onsite= v.filter(function(x){ return x.source==="onsite"; }).length;
  var pct   = total ? Math.round(att*100/total) : 0;

  var byCat = {};
  v.forEach(function(x){
    var k = x.category || "visitor";
    byCat[k] = byCat[k] || {reg:0,att:0};
    byCat[k].reg++;
    if (x.checked_in_at) byCat[k].att++;
  });
  var catRows = Object.keys(byCat).map(function(k){
    var c = byCat[k];
    return '<tr><td><b>'+esc(CATS[k]||k)+'</b></td><td class="num">'+c.reg+'</td>' +
           '<td class="num">'+c.att+'</td><td class="num">'+(c.reg?Math.round(c.att*100/c.reg):0)+'%</td></tr>';
  }).join("");

  // ذروة الدخول
  var hrs = {};
  v.forEach(function(x){ if(!x.checked_in_at) return;
    var h = new Date(x.checked_in_at).getHours(); hrs[h] = (hrs[h]||0)+1; });
  var hKeys = Object.keys(hrs).sort(function(a,b){ return a-b; });
  var hRows = hKeys.length ? hKeys.map(function(h){
    return '<tr><td class="mono">'+String(h).padStart(2,"0")+':00</td><td class="num">'+hrs[h]+'</td></tr>';
  }).join("") : '';

  // المبيعات
  var sr = await sb.rpc("sales_report", { p_event_slug: S.ev });
  var sales = (sr.data && sr.data.ok) ? sr.data : null;
  var salesHtml = "";
  if (sales){
    var t = sales.totals || {};
    var byType = (sales.by_type||[]).map(function(x){
      return '<tr><td><b>'+esc(x.name_ar)+'</b></td>' +
        '<td class="num">'+money(x.price)+'</td>' +
        '<td class="num">'+x.tickets+'</td>' +
        '<td class="num">'+money(x.revenue)+'</td></tr>';
    }).join("");
    salesHtml = '<div class="card"><h2>المبيعات</h2>' +
      '<div class="tiles"><div class="tile"><div class="k">الإيراد</div>' +
      '<div class="v">'+money(t.revenue)+'</div><div class="s">ريال</div></div>' +
      '<div class="tile"><div class="k">التذاكر المباعة</div><div class="v">'+(t.tickets||0)+'</div></div>' +
      '<div class="tile"><div class="k">بانتظار الدفع</div><div class="v">'+(t.pending||0)+'</div></div>' +
      '<div class="tile"><div class="k">عمليات فاشلة</div><div class="v">'+(t.failed||0)+'</div></div></div>' +
      (byType ? '<div class="scroll" style="margin-top:12px"><table><tr><th>الفئة</th><th>السعر</th>' +
        '<th>التذاكر</th><th>الإيراد</th></tr>'+byType+'</table></div>' : '') + '</div>';
  }

  shell('<div class="card"><h2>الحضور <small>'+esc(ev.name_ar)+'</small></h2>' +
    '<div class="tiles">' +
    '<div class="tile"><div class="k">إجمالي المسجّلين</div><div class="v">'+total+'</div></div>' +
    '<div class="tile"><div class="k">الحضور الفعلي</div><div class="v">'+att+'</div></div>' +
    '<div class="tile"><div class="k">سجّلوا في الموقع</div><div class="v">'+onsite+'</div></div>' +
    '<div class="tile"><div class="k">نسبة الحضور</div><div class="v">'+pct+'%</div></div></div>' +
    (catRows ? '<div class="scroll" style="margin-top:14px"><table><tr><th>الفئة</th><th>مسجّل</th>' +
      '<th>حضر</th><th>النسبة</th></tr>'+catRows+'</table></div>' : '') + '</div>' +
    salesHtml +
    (hRows ? '<div class="card"><h2>ساعات الدخول</h2><div class="scroll"><table><tr>' +
      '<th>الساعة</th><th>عدد الداخلين</th></tr>'+hRows+'</table></div></div>' : ''));
}

// ===================== التذاكر =====================
var editTx = null;
async function ticketsView(){
  loading();
  var ev = S.events.filter(function(e){ return e.slug===S.ev; })[0];
  if (!ev){ shell('<div class="card"><div class="empty">اختر معرضاً</div></div>'); return; }

  var r = await sb.from("ticket_types").select("*").eq("event_id", ev.id).order("sort_order");
  var list = r.data || [];

  var rows = list.length ? list.map(function(t){
    return '<tr><td><b>'+esc(t.name_ar)+'</b><div class="hint mono">'+esc(t.code)+'</div></td>' +
      '<td class="num">'+(t.price===0?"مجاناً":money(t.price)+" ريال")+'</td>' +
      '<td class="num">'+(t.capacity==null?"بلا حد":t.capacity)+'</td>' +
      '<td>'+(t.is_active?'<span class="chip g">مفعّلة</span>':'<span class="chip n">موقوفة</span>')+'</td>' +
      '<td><button class="btn g sm" data-ed="'+esc(t.code)+'">تعديل</button></td></tr>';
  }).join("") : '';

  var e = editTx;
  var form = '<div class="card"><h2>'+(e?'تعديل: '+esc(e.name_ar):'فئة تذاكر جديدة')+'</h2>' +
    '<form id="tf"><div class="grid2">' +
    '<div><label for="t_code">المعرّف <small>إنجليزي</small></label>' +
    '<input class="inp mono" id="t_code" required value="'+esc(e?e.code:"")+'"'+(e?' readonly':'')+'></div>' +
    '<div><label for="t_name">الاسم المعروض</label>' +
    '<input class="inp" id="t_name" required value="'+esc(e?e.name_ar:"")+'"></div>' +
    '<div><label for="t_price">السعر بالريال <small>0 = مجاناً</small></label>' +
    '<input class="inp" id="t_price" type="number" min="0" step="0.01" value="'+(e?money(e.price):"0")+'"></div>' +
    '<div><label for="t_cap">السعة <small>فارغ = بلا حد</small></label>' +
    '<input class="inp" id="t_cap" type="number" min="1" value="'+(e&&e.capacity!=null?e.capacity:"")+'"></div>' +
    '<div><label for="t_sort">الترتيب</label>' +
    '<input class="inp" id="t_sort" type="number" value="'+(e?e.sort_order:list.length+1)+'"></div>' +
    '<div><label for="t_color">اللون</label>' +
    '<input class="inp" id="t_color" type="color" value="'+esc(e?(e.color||"#0d5a92"):"#0d5a92")+'"></div>' +
    '</div>' +
    '<label for="t_perks">المزايا</label>' +
    '<input class="inp" id="t_perks" value="'+esc(e?(e.perks_ar||""):"")+'">' +
    '<div class="row" style="margin-top:14px"><label style="margin:0"><input type="checkbox" id="t_act"'+
    (!e||e.is_active?" checked":"")+'> مفعّلة</label></div>' +
    '<div class="row" style="margin-top:14px"><button class="btn" type="submit">حفظ</button>' +
    (e?'<button class="btn g" type="button" id="tcancel">إلغاء</button>':'') +
    '</div></form></div>';

  shell('<div class="card"><h2>أنواع التذاكر <small>'+esc(ev.name_ar)+'</small></h2>' +
    (rows ? '<div class="scroll"><table><tr><th>الفئة</th><th>السعر</th><th>السعة</th>' +
      '<th>الحالة</th><th></th></tr>'+rows+'</table></div>'
      : '<div class="empty">لا توجد فئات بعد</div>') + '</div>' + form);

  document.querySelectorAll("[data-ed]").forEach(function(b){
    b.onclick = function(){
      editTx = list.filter(function(x){ return x.code===b.getAttribute("data-ed"); })[0];
      ticketsView();
    };
  });
  var cx = $("#tcancel"); if (cx) cx.onclick = function(){ editTx=null; ticketsView(); };

  $("#tf").onsubmit = async function(evt){
    evt.preventDefault();
    var halalas = Math.round(parseFloat($("#t_price").value || "0") * 100);
    var cap = $("#t_cap").value.trim();
    var r2 = await sb.rpc("save_ticket_type", {
      p_event_slug: S.ev,
      p_code:    $("#t_code").value.trim(),
      p_name_ar: $("#t_name").value.trim(),
      p_price:   halalas,
      p_name_en: null,
      p_perks_ar:$("#t_perks").value.trim() || null,
      p_color:   $("#t_color").value,
      p_capacity: cap === "" ? null : parseInt(cap,10),
      p_sort:    parseInt($("#t_sort").value||"0",10),
      p_active:  $("#t_act").checked
    });
    var d = r2.data || {};
    if (d.ok){ editTx=null; S.msg="تم الحفظ"; ticketsView(); }
    else { S.err = d.error==="forbidden" ? "لا تملك صلاحية" :
           d.error==="bad_code" ? "المعرّف غير صالح" : "تعذّر الحفظ"; ticketsView(); }
  };
}

// ===================== المعارض =====================
var editEv = null;
function eventsView(){
  var rows = S.events.map(function(e){
    return '<tr><td><b>'+esc(e.name_ar)+'</b><div class="hint mono">'+esc(e.slug)+'</div></td>' +
      '<td class="num">'+e.registered+'</td><td class="num">'+e.attended+'</td>' +
      '<td>'+(e.is_open?'<span class="chip g">مفتوح</span>':'<span class="chip n">مغلق</span>')+'</td>' +
      '<td><button class="btn g sm" data-eev="'+esc(e.slug)+'">تعديل</button></td></tr>';
  }).join("");

  var e = editEv;
  var form = '<div class="card"><h2>'+(e?'تعديل: '+esc(e.name_ar):'معرض جديد')+'</h2>' +
    '<form id="ef"><div class="grid2">' +
    '<div><label for="e_ar">اسم المعرض</label><input class="inp" id="e_ar" required value="'+esc(e?e.name_ar:"")+'"></div>' +
    '<div><label for="e_slug">معرّف الرابط <small>إنجليزي</small></label>' +
    '<input class="inp mono" id="e_slug" required value="'+esc(e?e.slug:"")+'"></div>' +
    '<div><label for="e_logo">رابط الشعار</label><input class="inp" id="e_logo" value="'+esc(e?(e.logo_url||""):"")+'"></div>' +
    '<div><label for="e_acc">لون الهوية</label>' +
    '<input class="inp" id="e_acc" type="color" value="'+esc(e?(e.accent||"#0d5a92"):"#0d5a92")+'"></div>' +
    '</div><label for="e_note">عبارة ترحيبية</label>' +
    '<input class="inp" id="e_note" value="'+esc(e?(e.note_ar||""):"")+'">' +
    '<div class="row" style="margin-top:14px"><label style="margin:0">' +
    '<input type="checkbox" id="e_open"'+(!e||e.is_open?" checked":"")+'> التسجيل مفتوح</label></div>' +
    '<div class="row" style="margin-top:14px"><button class="btn" type="submit">حفظ</button>' +
    (e?'<button class="btn g" type="button" id="ecancel">إلغاء</button>' +
       '<button class="btn d" type="button" id="edel">حذف</button>':'') +
    '</div></form>' +
    (e?'<div class="hint" style="margin-top:10px">رابط التسجيل: <span class="mono">'+
       location.origin+'/?e='+esc(e.slug)+'</span></div>':'') + '</div>';

  shell('<div class="card"><h2>المعارض</h2>' +
    (rows ? '<div class="scroll"><table><tr><th>المعرض</th><th>مسجّل</th><th>حضر</th>' +
      '<th>الحالة</th><th></th></tr>'+rows+'</table></div>' : '<div class="empty">لا توجد معارض</div>') +
    '</div>' + form);

  document.querySelectorAll("[data-eev]").forEach(function(b){
    b.onclick = function(){
      editEv = S.events.filter(function(x){ return x.slug===b.getAttribute("data-eev"); })[0];
      eventsView();
    };
  });
  var c = $("#ecancel"); if (c) c.onclick = function(){ editEv=null; eventsView(); };

  var del = $("#edel");
  if (del) del.onclick = async function(){
    if (!confirmBox("حذف «"+editEv.name_ar+"»؟ لا يمكن التراجع.")) return;
    var r = await sb.rpc("delete_event", { p_id: editEv.id });
    var d = r.data || {};
    if (d.ok){ editEv=null; S.msg="حُذف المعرض"; await loadEvents(); eventsView(); }
    else S.err = d.error==="has_visitors" ? "لا يمكن الحذف — فيه "+d.count+" زائراً" : "تعذّر الحذف", eventsView();
  };

  $("#ef").onsubmit = async function(evt){
    evt.preventDefault();
    var r = await sb.rpc("save_event", {
      p_id: e ? e.id : null,
      p_slug: $("#e_slug").value.trim(),
      p_name_ar: $("#e_ar").value.trim(),
      p_name_en: null, p_opens: null, p_closes: null,
      p_is_open: $("#e_open").checked,
      p_logo: $("#e_logo").value.trim() || null,
      p_note_ar: $("#e_note").value.trim() || null,
      p_note_en: null,
      p_accent: $("#e_acc").value,
      p_badge: null
    });
    var d = r.data || {};
    if (d.ok){ editEv=null; S.msg="تم الحفظ"; await loadEvents(); if(!S.ev) S.ev=d.slug; eventsView(); }
    else { S.err = d.error==="slug_taken" ? "معرّف الرابط مستخدم" :
           d.error==="forbidden" ? "لا تملك صلاحية" : "تعذّر الحفظ"; eventsView(); }
  };
}

function confirmBox(msg){ return window.confirm(msg); }

// ===================== الموظفون =====================
async function staffView(){
  loading();
  var r = await sb.rpc("list_staff");
  var d = r.data || {};
  var list = (d.ok && d.staff) || [];

  var rows = list.map(function(s){
    return '<tr><td><b>'+esc(s.full_name||"—")+'</b></td>' +
      '<td class="mono">'+esc(s.email)+'</td>' +
      '<td><span class="chip '+(s.role==="owner"?"g":"n")+'">'+esc(ROLES[s.role]||s.role)+'</span></td>' +
      '<td>'+(s.is_active?'<span class="chip g">نشط</span>':'<span class="chip d">موقوف</span>')+'</td>' +
      '</tr>';
  }).join("");

  shell('<div class="card"><h2>الموظفون والصلاحيات</h2>' +
    '<div class="scroll"><table><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>الحالة</th></tr>' +
    rows+'</table></div></div>' +
    '<div class="card"><h2>إضافة موظف أو تعديل دوره</h2>' +
    '<div class="msg w">الموظف يجب أن يكون له حساب في Supabase أولاً:<br>' +
    'Authentication ← Users ← Add user ← مع تفعيل <b>Auto Confirm User</b>.<br>' +
    'ثم اكتب بريده هنا وحدّد دوره.</div>' +
    '<form id="sf"><div class="grid2">' +
    '<div><label for="s_em">البريد الإلكتروني</label><input class="inp" id="s_em" type="email" required></div>' +
    '<div><label for="s_nm">الاسم</label><input class="inp" id="s_nm"></div>' +
    '<div><label for="s_rl">الدور</label><select class="inp" id="s_rl">' +
    '<option value="gate">بوابة — البوابة فقط</option>' +
    '<option value="staff" selected>موظف — البوابة والزوار والتسجيل السريع</option>' +
    '<option value="admin">مدير — كل شيء عدا إدارة الموظفين</option>' +
    '<option value="owner">مالك — كل الصلاحيات</option>' +
    '</select></div>' +
    '<div><label style="margin-top:34px"><input type="checkbox" id="s_act" checked> نشط</label></div>' +
    '</div><button class="btn" type="submit" style="margin-top:14px">حفظ</button></form></div>');

  $("#sf").onsubmit = async function(e){
    e.preventDefault();
    var r2 = await sb.rpc("set_staff", {
      p_email: $("#s_em").value.trim(),
      p_name:  $("#s_nm").value.trim() || null,
      p_role:  $("#s_rl").value,
      p_perms: {},
      p_active: $("#s_act").checked
    });
    var d2 = r2.data || {};
    if (d2.ok){ S.msg="تم الحفظ"; staffView(); }
    else { S.err = d2.error==="no_user" ? "لا يوجد حساب بهذا البريد — أنشئه في Authentication أولاً" :
           d2.error==="forbidden"  ? "المالك وحده يدير الموظفين" :
           d2.error==="last_owner" ? "لا يمكن تنزيل المالك الوحيد" : "تعذّر الحفظ"; staffView(); }
  };
}

// ===================== التوجيه =====================
function route(){
  if (S.tab==="gate")    return gateView(null);
  if (S.tab==="list")    return listView();
  if (S.tab==="quick")   return quickView();
  if (S.tab==="rep")     return repView();
  if (S.tab==="tickets") return isAdmin() ? ticketsView() : gateView(null);
  if (S.tab==="events")  return isAdmin() ? eventsView() : gateView(null);
  if (S.tab==="staff")   return isOwner() ? staffView()  : gateView(null);
  gateView(null);
}

async function loadEvents(){
  var r = await sb.rpc("list_events");
  var d = r.data || {};
  S.events = (d.ok && d.events) || [];
  if (!S.ev && S.events.length) S.ev = S.events[0].slug;
}

async function boot(){
  var ses = await sb.auth.getSession();
  if (!ses.data.session){ loginView(); return; }

  app.innerHTML = '<div class="card"><span class="spin"></span> جارٍ التحميل…</div>';

  var uid = ses.data.session.user.id;
  var st  = await sb.from("staff").select("*").eq("user_id", uid).maybeSingle();

  if (!st.data || !st.data.is_active){
    app.innerHTML = '<div class="card" style="max-width:420px;margin:40px auto">' +
      '<div class="msg e">هذا الحساب غير مصرّح له بالدخول.</div>' +
      '<button class="btn w" id="o2">خروج</button></div>';
    $("#o2").onclick = async function(){ await sb.auth.signOut(); location.reload(); };
    return;
  }

  S.me = ses.data.session.user;
  S.staff = st.data;
  await loadEvents();
  route();
}

boot();
</script>
</body>
</html>
