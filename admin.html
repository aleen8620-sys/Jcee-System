<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة الإدارة — نظام تسجيل الزوار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  try{
    var saved = localStorage.getItem("jcee-theme");
    var dark = saved ? saved === "dark"
      : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-appearance", dark ? "dark" : "light");
  }catch(e){ document.documentElement.setAttribute("data-appearance","light"); }
})();
</script>
<style>
:root, :root[data-appearance="light"]{
  --bg:#eef3f7; --panel:#ffffff; --panel-2:#f6fafc;
  --line:#d8e5ee; --line-soft:#e9f1f6;
  --ink:#0a2c47; --ink-2:#3d6483; --ink-3:#7191aa;
  --brand:#0d5a92; --brand-ink:#ffffff; --brand-soft:#e4f0fa;
  --good:#146b4f; --good-soft:#dcf1e7;
  --warn:#8a5510; --warn-soft:#fbeedb;
  --danger:#96331f; --danger-soft:#fbe4dd;
  --vip:#8a6410; --vip-soft:#f8eed6;
  --shadow:0 1px 2px rgba(10,44,71,.06), 0 10px 26px -14px rgba(10,44,71,.28);
  --r:14px;
  --sans:"IBM Plex Sans Arabic", ui-sans-serif, system-ui, "Segoe UI", Tahoma, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
:root[data-appearance="dark"]{
  --bg:#061119; --panel:#0e2135; --panel-2:#132b43;
  --line:#1f3d59; --line-soft:#1a3450;
  --ink:#e9f3fa; --ink-2:#a7c5dc; --ink-3:#7597b3;
  --brand:#4fa9dd; --brand-ink:#04223a; --brand-soft:#12344f;
  --good:#4dbc92; --good-soft:#0f2e24;
  --warn:#dfa254; --warn-soft:#2f2010;
  --danger:#e0876f; --danger-soft:#33170f;
  --vip:#d3aa4a; --vip-soft:#2f2610;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 30px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
     line-height:1.7;font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
:root[data-appearance="dark"] body{background:#03090e}

/* ============ الإطار ============ */
.app{min-height:100vh;display:grid;grid-template-columns:252px minmax(0,1fr)}
:root[data-appearance="dark"] .app{
  background:linear-gradient(168deg,#0f3555 0%,#08202f 38%,#040e15 72%,#03090e 100%)}
@media (max-width:900px){ .app{grid-template-columns:1fr} .app > .side{display:none} }

.side{background:var(--panel);border-inline-end:1px solid var(--line);
      display:flex;flex-direction:column;gap:2px;padding:16px 12px}
:root[data-appearance="dark"] .side,
:root[data-appearance="dark"] .drawer{
  background:linear-gradient(200deg,#123b5c 0%,#0a2436 34%,#061219 70%,#040c11 100%)}
.brandmark{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;
           border-bottom:1px solid var(--line-soft);margin-bottom:10px}
.brandmark .mk{width:38px;height:38px;border-radius:11px;background:var(--brand);
               color:var(--brand-ink);display:grid;place-items:center;flex:none}
.brandmark .t1{font-size:15px;font-weight:700;line-height:1.2}
.brandmark .t2{font-size:9.5px;letter-spacing:.14em;color:var(--ink-3);font-weight:600}
.evsel{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;
       padding:9px 11px;margin-bottom:12px}
.evsel .lbl2{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
             color:var(--ink-3);font-weight:600}
.evsel select{width:100%;max-width:100%;border:0;background:none;font-size:13px;
              font-weight:600;padding:1px 0;margin-top:1px;text-overflow:ellipsis}
.navgrp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
        color:var(--ink-3);font-weight:600;padding:12px 10px 5px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;
         border-radius:10px;padding:8px 10px;font-size:14px;font-weight:500;
         color:var(--ink-2);text-align:start;transition:background .12s}
.navitem:hover{background:var(--panel-2);color:var(--ink)}
.navitem[aria-current="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
:root[data-appearance="dark"] .navitem[aria-current="true"]{
  background:linear-gradient(90deg,rgba(79,169,221,.30),rgba(79,169,221,.03));
  color:#eaf6ff;box-shadow:inset 0 0 0 1px rgba(79,169,221,.42), 0 0 18px -6px rgba(79,169,221,.5)}
.navitem .ico{width:20px;height:20px;flex:none;display:grid;place-items:center;opacity:.95}
.navitem .ico svg{width:17px;height:17px}
.navitem > span:nth-child(2){flex:1;min-width:0}
.navitem .cnt{font-family:var(--mono);font-size:11px;background:var(--brand-soft);
              color:var(--brand);border-radius:6px;padding:1px 6px;font-weight:600}
.navitem[aria-current="true"] .cnt{background:rgba(255,255,255,.22);color:inherit}
.sidefoot{margin-top:auto;display:grid;gap:9px;padding-top:12px}
.status{display:flex;align-items:center;gap:9px;background:var(--good-soft);color:var(--good);
        border-radius:11px;padding:9px 11px;font-size:12.5px;font-weight:600}
.who{display:flex;align-items:center;gap:10px;border:1px solid var(--line);
     border-radius:11px;padding:8px 10px}
.av{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--brand-ink);
    display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.who .n{font-size:13.5px;font-weight:600;line-height:1.3}
.who .r{font-size:11.5px;color:var(--ink-3)}
.who .x{margin-inline-start:auto;width:30px;height:30px;border-radius:9px;
        border:1px solid var(--line);background:none;color:var(--ink-3);
        display:grid;place-items:center;flex:none}
.who .x:hover{border-color:var(--danger);color:var(--danger)}

main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px 20px;
        border-bottom:1px solid var(--line);background:var(--panel)}
:root[data-appearance="dark"] .topbar,
:root[data-appearance="dark"] .mtop{
  background:linear-gradient(180deg,rgba(18,59,92,.55),rgba(6,18,25,.2))}
.hello h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em}
.hello p{margin:1px 0 0;font-size:13px;color:var(--ink-3)}
.tools{margin-inline-start:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.iconbtn{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;
         padding:7px 11px;font-size:13px;font-weight:600;color:var(--ink-2);
         display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.iconbtn:hover{border-color:var(--brand);color:var(--ink)}
.iconbtn svg{width:16px;height:16px}
.screen{padding:18px 20px 30px;display:grid;gap:16px;align-content:start}

/* ============ الجوال ============ */
.mtop{display:none;align-items:center;gap:10px;padding:12px 14px;
      border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
@media (max-width:900px){ .mtop{display:flex} .topbar{display:none} .screen{padding:14px 14px 26px} }
.mtop .ttl{font-size:15px;font-weight:700;flex:1;text-align:center}
.iconsq{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
        background:var(--panel-2);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.iconsq svg{width:17px;height:17px}
.scrim{position:fixed;inset:0;background:rgba(4,18,30,.55);z-index:20}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(84%,318px);
        background:var(--panel);border-inline-end:1px solid var(--line);z-index:21;
        display:flex;flex-direction:column;gap:2px;padding:16px 14px;overflow-y:auto;
        box-shadow:var(--shadow)}

/* ============ المكوّنات ============ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
:root[data-appearance="dark"] .card,
:root[data-appearance="dark"] .tile{
  background:linear-gradient(160deg,rgba(23,66,100,.55),rgba(9,26,38,.75))}
.card > .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
            padding:13px 16px;border-bottom:1px solid var(--line-soft)}
.card > .hd h2{margin:0;font-size:14.5px;font-weight:600}
.card > .hd .sub{font-size:12px;color:var(--ink-3)}
.card > .hd .end{margin-inline-start:auto}
.card > .bd{padding:16px;display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.grid2 > *{min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
      padding:14px 15px;display:grid;gap:2px}
.tile .k{font-size:12px;color:var(--ink-3);font-weight:500}
.tile .v{font-size:29px;font-weight:700;font-variant-numeric:tabular-nums;
         letter-spacing:-.025em;line-height:1.2}
.tile .s{font-size:11.5px;color:var(--ink-3)}
.btn{border:0;border-radius:11px;padding:10px 16px;font-weight:600;font-size:14px;
     background:var(--brand);color:var(--brand-ink);display:inline-flex;align-items:center;
     gap:8px;justify-content:center;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.w{width:100%}
.btn.ghost{background:var(--panel);color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--ink)}
.btn.dng{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.55;cursor:default}
.inp{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:11px;
     background:var(--panel);color:var(--ink);font-size:15px}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.inp[type="color"]{padding:4px;height:42px}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;
      font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.n{background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.g{background:var(--good-soft);color:var(--good)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
.chip.d{background:var(--danger-soft);color:var(--danger)}
.chip.v{background:var(--vip-soft);color:var(--vip)}
.chip.b{background:var(--brand-soft);color:var(--brand)}
.note{border-radius:12px;padding:12px 14px;font-size:13.5px;border-inline-start:3px solid;
      display:grid;gap:4px}
.note.b{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.note.g{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.note.w{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.note.d{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.scroll{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:start;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
   color:var(--ink-3);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);
   white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap;color:var(--ink-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--ink);font-weight:600}
.empty{padding:34px;text-align:center;color:var(--ink-3);font-size:13.5px}
.rowline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500}
.spin{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--brand);
      border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- البوابة ---- */
.gatein{width:100%;text-align:center;font-family:var(--mono);font-size:40px;font-weight:600;
        letter-spacing:.22em;padding:20px 12px;border:2px solid var(--brand);border-radius:16px;
        background:var(--panel);color:var(--ink);direction:ltr}
.gatein:focus{outline:none;box-shadow:0 0 0 4px var(--brand-soft)}
.gateres{border-radius:14px;padding:20px;text-align:center}
.gateres .big{font-size:23px;font-weight:700}
.gateres .sm{font-size:13.5px;margin-top:4px;opacity:.9}
.gateres.ok{background:var(--good-soft);color:var(--good)}
.gateres.al{background:var(--warn-soft);color:var(--warn)}
.gateres.no{background:var(--danger-soft);color:var(--danger)}

/* ---- الدخول ---- */
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg)}
:root[data-appearance="dark"] .loginwrap{
  background:linear-gradient(168deg,#0f3555 0%,#08202f 38%,#040e15 72%,#03090e 100%)}
.loginbox{width:100%;max-width:400px}
.loginbox .top{text-align:center;margin-bottom:18px}
.loginbox .mk{width:56px;height:56px;border-radius:16px;background:var(--brand);
              color:var(--brand-ink);display:grid;place-items:center;margin:0 auto 12px}
.loginbox h1{margin:0;font-size:22px;font-weight:700}
.loginbox p{margin:3px 0 0;font-size:13px;color:var(--ink-3)}
</style>
</head>

function loginView(err){
  app.innerHTML =
   '<div class="loginwrap"><div class="loginbox">' +
   '<div class="top"><div class="mk">'+I.mark+'</div>' +
   '<h1>لوحة الإدارة</h1><p>نظام تسجيل الزوار للمعارض</p></div>' +

   (err ? '<div class="note d">'+esc(err)+'</div>' : '') +

   '<div><label class="lbl" for="le">البريد الإلكتروني</label>' +

   '<div><label class="lbl" for="lp">كلمة المرور</label>' +
   '<input class="inp" id="lp" type="password" required autocomplete="current-password"></div>' +
   '<button class="btn w" type="submit">دخول</button>' +
   '</form></div></div></div></div>';

  $("#lf").addEventListener("submit", async function(e){
    e.preventDefault();
    var b = e.target.querySelector("button");
    b.disabled = true; b.textContent = "جارٍ الدخول…";
    var r = await sb.auth.signInWithPassword({ email:$("#le").value.trim(), password:$("#lp").value });
    if (r.error){
      var raw = r.error.message || "خطأ غير معروف", m = raw;
      if (/invalid login credentials/i.test(raw))     m = "البريد أو كلمة المرور غير صحيحة";
      else if (/email not confirmed/i.test(raw))      m = "البريد غير مُفعّل";
      else if (/database error/i.test(raw))           m = "خطأ في قاعدة البيانات — صفّ المستخدم ناقص";
      else if (/failed to fetch|network/i.test(raw))  m = "تعذّر الاتصال بالخادم";
      loginView(m + (r.error.status ? " ["+r.error.status+"]" : ""));
      return;
    }
    boot();
  });
}

  var mb=$("#mbtn"); if (mb) mb.onclick = function(){ S.drawer=true; route(); };
  var sc=$("#scrim"); if (sc) sc.onclick = function(){ S.drawer=false; route(); };

      '<th>المصدر</th><th>الحضور</th><th></th></tr>'+body+'</table></div>'
      : '<div class="empty">لا توجد نتائج</div>') + '</div></div>');

  var sq = $("#sq");

    Q = sq.value.trim(); listView(); }, 400); };
  $("#csv").onclick = function(){ exportCsv(rows, ev.name_ar); };

function exportCsv(rows, evname){
  var head = ["الرمز","الاسم","الجوال","البريد","الجهة","المسمى","الفئة","المصدر","الحضور","وقت الدخول","التسجيل"];
  var lines = [head.join(",")];
  rows.forEach(function(v){
    lines.push([v.code,v.name,v.phone,v.email||"",v.company||"",v.job_title||"",
      CATS[v.category]||v.category, v.source==="onsite"?"الكاونتر":"إلكتروني",
      v.checked_in_at?"حضر":"لم يحضر", v.checked_in_at||"", v.created_at||""]
      .map(function(x){ return '"'+String(x==null?"":x).replace(/"/g,'""')+'"'; }).join(","));
  });
  var blob = new Blob(["﻿"+lines.join("\r\n")], {type:"text/csv;charset=utf-8;"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "visitors-"+(evname||"event")+".csv";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
}

// ===================== التقارير =====================
async function repView(){
  loading();
  var ev = curEvent(); if (!ev) return noEvent();

  var r = await sb.from("visitors").select("category,source,checked_in_at").eq("event_id", ev.id);
  var v = r.data || [];
  var total = v.length;
  var att   = v.filter(function(x){ return x.checked_in_at; }).length;
  var onsite= v.filter(function(x){ return x.source==="onsite"; }).length;
  var pct   = total ? Math.round(att*100/total) : 0;

  var byCat = {};
  v.forEach(function(x){
    var k = x.category || "visitor";
    byCat[k] = byCat[k] || {reg:0,att:0};
    byCat[k].reg++;
    if (x.checked_in_at) byCat[k].att++;
  });
  var catRows = Object.keys(byCat).map(function(k){
    var c = byCat[k];
    return '<tr><td><b>'+esc(CATS[k]||k)+'</b></td><td class="num">'+c.reg+'</td>' +
           '<td class="num">'+c.att+'</td><td class="num">'+(c.reg?Math.round(c.att*100/c.reg):0)+'%</td></tr>';
  }).join("");

  var hrs = {};
  v.forEach(function(x){ if(!x.checked_in_at) return;
    var h = new Date(x.checked_in_at).getHours(); hrs[h] = (hrs[h]||0)+1; });
  var hKeys = Object.keys(hrs).sort(function(a,b){ return a-b; });
  var hMax  = hKeys.reduce(function(m,h){ return Math.max(m, hrs[h]); }, 0);
  var hRows = hKeys.map(function(h){
    var w = hMax ? Math.round(hrs[h]*100/hMax) : 0;
    return '<tr><td class="mono">'+String(h).padStart(2,"0")+':00</td>' +
      '<td style="width:100%"><span style="display:block;height:7px;border-radius:4px;' +
      'background:var(--brand);width:'+w+'%;min-width:4px"></span></td>' +
      '<td class="num">'+hrs[h]+'</td></tr>';
  }).join("");

  var sr = await sb.rpc("sales_report", { p_event_slug: S.ev });
  var sales = (sr.data && sr.data.ok) ? sr.data : null;
  var salesHtml = "";
  if (sales){
    var t = sales.totals || {};
    var byType = (sales.by_type||[]).map(function(x){
      return '<tr><td><b>'+esc(x.name_ar)+'</b></td>' +
        '<td class="num">'+(x.price===0?"مجاناً":money(x.price))+'</td>' +
        '<td class="num">'+x.tickets+'</td>' +
        '<td class="num">'+money(x.revenue)+'</td></tr>';
    }).join("");
    salesHtml = '<div class="card"><div class="hd"><h2>المبيعات</h2></div><div class="bd">' +
      '<div class="tiles">' +
      '<div class="tile"><div class="k">الإيراد</div><div class="v">'+money(t.revenue)+'</div><div class="s">ريال</div></div>' +
      '<div class="tile"><div class="k">التذاكر المباعة</div><div class="v">'+(t.tickets||0)+'</div></div>' +
      '<div class="tile"><div class="k">بانتظار الدفع</div><div class="v">'+(t.pending||0)+'</div></div>' +
      '<div class="tile"><div class="k">عمليات فاشلة</div><div class="v">'+(t.failed||0)+'</div></div></div>' +
      (byType ? '<div class="scroll"><table><tr><th>الفئة</th><th>السعر</th>' +
        '<th>التذاكر</th><th>الإيراد</th></tr>'+byType+'</table></div>' : '') + '</div></div>';
  }

  shell('<div class="card"><div class="hd"><h2>الحضور</h2>' +
    '<span class="sub">'+esc(ev.name_ar)+'</span></div><div class="bd">' +
    '<div class="tiles">' +
    '<div class="tile"><div class="k">إجمالي المسجّلين</div><div class="v">'+total+'</div></div>' +
    '<div class="tile"><div class="k">الحضور الفعلي</div><div class="v">'+att+'</div></div>' +
    '<div class="tile"><div class="k">سجّلوا في الموقع</div><div class="v">'+onsite+'</div></div>' +
    '<div class="tile"><div class="k">نسبة الحضور</div><div class="v">'+pct+'%</div></div></div>' +
    (catRows ? '<div class="scroll"><table><tr><th>الفئة</th><th>مسجّل</th>' +
      '<th>حضر</th><th>النسبة</th></tr>'+catRows+'</table></div>' : '') + '</div></div>' +
    salesHtml +
    (hRows ? '<div class="card"><div class="hd"><h2>ساعات الدخول</h2></div><div class="bd">' +
      '<div class="scroll"><table><tr><th>الساعة</th><th></th><th>الداخلون</th></tr>' +
      hRows+'</table></div></div></div>' : ''));
}

  var r = await sb.rpc("event_overview", { p_slug: S.ev });
  var d = r.data || {};
  if (!d.ok){

  }

  var st = d.stats || {}, sl = d.sales || {};

  var when = "";

    when = dte(d.starts_on);

  var hrs = d.hourly || [];
  var hMax = hrs.reduce(function(m,x){ return Math.max(m, x.n); }, 0);
  var bars = hrs.map(function(x){

      String(x.h).padStart(2,"0")+'</div>' +
      '<div class="num" style="font-size:12px;font-weight:600">'+x.n+'</div></div>';
  }).join("");

  var latest = (d.latest||[]).map(function(v){
    return '<tr><td><b>'+esc(v.name)+'</b></td>' +
      '<td>'+esc(v.company||"—")+'</td>' +
      '<td><span class="chip n">'+esc(CATS[v.category]||v.category)+'</span></td>' +
      '<td class="mono">'+dt(v.checked_in_at)+'</td></tr>';

  shell(
    '<div class="card"><div class="bd">' +
      '<div style="font-size:11.5px;font-weight:600;letter-spacing:.09em;color:var(--brand)">' +
        'أهلاً ' + esc((S.staff.full_name||"").split(/\s+/)[0] || "") + '</div>' +
      '<div style="font-size:25px;font-weight:700;letter-spacing:-.02em;margin-top:2px">' +
        esc(d.name||"") + '</div>' +
      '<div style="font-size:13px;color:var(--ink-3)">' +
        esc([d.venue, when].filter(Boolean).join(" · ") || "لم تُضبط بيانات المكان والتاريخ بعد") +
      '</div></div></div>' +

    '<div class="tiles">' +
      '<div class="tile"><div class="k">المسجّلون</div><div class="v">'+(st.registered||0)+'</div>' +
        '<div class="s">منهم '+(st.today||0)+' اليوم</div></div>' +
      '<div class="tile"><div class="k">دخلوا البوابة</div><div class="v">'+(st.attended||0)+'</div>' +
        '<div class="s">'+pct+'% من المسجّلين</div></div>' +
      '<div class="tile"><div class="k">سجّلوا في الموقع</div><div class="v">'+(st.onsite||0)+'</div>' +
        '<div class="s">عند الكاونتر</div></div>' +
      '<div class="tile"><div class="k">الإيراد</div><div class="v">'+money(sl.revenue)+'</div>' +
        '<div class="s">ريال · '+(sl.tickets||0)+' تذكرة</div></div>' +
    '</div>' +

    (bars ? '<div class="card"><div class="hd"><h2>حركة الدخول بالساعة</h2></div>' +
      '<div class="bd"><div class="scroll"><div style="display:flex;gap:10px;align-items:flex-end">' +
      bars + '</div></div></div></div>' : '') +

    '<div class="card"><div class="hd"><h2>آخر من دخل</h2>' +
      '<span class="end"><button class="iconbtn" id="rfr">تحديث</button></span></div><div class="bd">' +
      (latest ? '<div class="scroll"><table><tr><th>الاسم</th><th>الجهة</th>' +
        '<th>الفئة</th><th>وقت الدخول</th></tr>'+latest+'</table></div>'
        : '<div class="empty">لم يدخل أحد بعد</div>') + '</div></div>');

  var rf = $("#rfr"); if (rf) rf.onclick = overviewView;
}

// ===================== إعدادات مشتركة =====================
async function loadCfg(force){
  if (S.cfg && S.cfg.slug === S.ev && !force) return S.cfg;
  var r = await sb.rpc("event_cfg", { p_slug: S.ev });
  var d = r.data || {};
  S.cfg = (d.ok && d.event) ? d.event : null;
  return S.cfg;
}
async function saveCfg(key, val){
  var r = await sb.rpc("save_event_cfg", { p_slug:S.ev, p_key:key, p_val:val });
  var d = r.data || {};
  if (d.ok){ S.msg = "حُفظ"; S.cfg = null; }
  else S.err = d.error==="forbidden" ? "لا تملك صلاحية" : "تعذّر الحفظ";
  return d.ok;
}

      p_capacity: cap === "" ? null : parseInt(cap,10),
      p_sort:    parseInt($("#t_sort").value||"0",10),
      p_active:  $("#t_act").checked
    });
    var d = r2.data || {};
    if (d.ok){ editTx=null; S.msg="تم الحفظ"; ticketsView(); }
    else { S.err = d.error==="forbidden" ? "لا تملك صلاحية" :
           d.error==="bad_code" ? "المعرّف غير صالح" : "تعذّر الحفظ"; ticketsView(); }
  };
}

// ===================== المعارض =====================
var editEv = null;
function eventsView(){
  var rows = S.events.map(function(e){
    return '<tr><td><b>'+esc(e.name_ar)+'</b><div class="hint mono">'+esc(e.slug)+'</div></td>' +
      '<td class="num">'+e.registered+'</td><td class="num">'+e.attended+'</td>' +
      '<td>'+(e.is_open?'<span class="chip g">مفتوح</span>':'<span class="chip n">مغلق</span>')+'</td>' +
      '<td><button class="btn ghost sm" data-eev="'+esc(e.slug)+'">تعديل</button></td></tr>';
  }).join("");

  var e = editEv;
  var form = '<div class="card"><div class="hd"><h2>'+
    (e?'تعديل: '+esc(e.name_ar):'معرض جديد')+'</h2></div><div class="bd">' +
    '<form id="ef" style="display:grid;gap:14px"><div class="grid2">' +
    '<div><label class="lbl" for="e_ar">اسم المعرض</label>' +
    '<input class="inp" id="e_ar" required value="'+esc(e?e.name_ar:"")+'"></div>' +
    '<div><label class="lbl" for="e_slug">معرّف الرابط (إنجليزي)</label>' +
    '<input class="inp mono" id="e_slug" required value="'+esc(e?e.slug:"")+'"></div>' +
    '<div><label class="lbl" for="e_logo">رابط الشعار</label>' +
    '<input class="inp mono" id="e_logo" value="'+esc(e?(e.logo_url||""):"")+'"></div>' +
    '<div><label class="lbl" for="e_acc">لون الهوية</label>' +
    '<input class="inp" id="e_acc" type="color" value="'+esc(e?(e.accent||"#0d5a92"):"#0d5a92")+'"></div>' +
    '</div>' +
    '<div><label class="lbl" for="e_note">عبارة ترحيبية</label>' +
    '<input class="inp" id="e_note" value="'+esc(e?(e.note_ar||""):"")+'"></div>' +
    '<label class="check"><input type="checkbox" id="e_open"'+(!e||e.is_open?" checked":"")+'> التسجيل مفتوح</label>' +
    '<div class="rowline"><button class="btn" type="submit">حفظ</button>' +
    (e?'<button class="btn ghost" type="button" id="ecancel">إلغاء</button>' +
       '<button class="btn dng" type="button" id="edel">حذف</button>':'') +
    '</div></form>' +
    (e?'<div class="note b">رابط التسجيل<br><span class="mono">'+
       esc(location.origin)+'/?e='+esc(e.slug)+'</span></div>':'') + '</div></div>';

  shell('<div class="card"><div class="hd"><h2>المعارض</h2>' +
    '<span class="sub">'+S.events.length+' معرض</span></div><div class="bd">' +
    (rows ? '<div class="scroll"><table><tr><th>المعرض</th><th>مسجّل</th><th>حضر</th>' +
      '<th>الحالة</th><th></th></tr>'+rows+'</table></div>' : '<div class="empty">لا توجد معارض</div>') +
    '</div></div>' + form);

  document.querySelectorAll("[data-eev]").forEach(function(b){
    b.onclick = function(){
      editEv = S.events.filter(function(x){ return x.slug===b.getAttribute("data-eev"); })[0];
      eventsView();
    };
  });
  var c = $("#ecancel"); if (c) c.onclick = function(){ editEv=null; eventsView(); };

  var del = $("#edel");
  if (del) del.onclick = async function(){
    if (!window.confirm("حذف «"+editEv.name_ar+"»؟ لا يمكن التراجع.")) return;
    var r = await sb.rpc("delete_event", { p_id: editEv.id });
    var d = r.data || {};
    if (d.ok){ editEv=null; S.msg="حُذف المعرض"; await loadEvents(); eventsView(); }
    else { S.err = d.error==="has_visitors" ? "لا يمكن الحذف — فيه "+d.count+" زائراً" : "تعذّر الحذف";
           eventsView(); }
  };

  $("#ef").onsubmit = async function(evt){
    evt.preventDefault();
    var r = await sb.rpc("save_event", {
      p_id: e ? e.id : null,
      p_slug: $("#e_slug").value.trim(),
      p_name_ar: $("#e_ar").value.trim(),
      p_name_en: null, p_opens: null, p_closes: null,
      p_is_open: $("#e_open").checked,
      p_logo: $("#e_logo").value.trim() || null,
      p_note_ar: $("#e_note").value.trim() || null,
      p_note_en: null,
      p_accent: $("#e_acc").value,
      p_badge: null
    });
    var d = r.data || {};
    if (d.ok){ editEv=null; S.msg="تم الحفظ"; await loadEvents(); if(!S.ev) S.ev=d.slug; eventsView(); }
    else { S.err = d.error==="slug_taken" ? "معرّف الرابط مستخدم" :
           d.error==="forbidden" ? "لا تملك صلاحية" : "تعذّر الحفظ"; eventsView(); }
  };
}

// ===================== الموظفون =====================
async function staffView(){
  loading();
  var r = await sb.rpc("list_staff");
  var d = r.data || {};
  var list = (d.ok && d.staff) || [];

  var rows = list.map(function(s){
    return '<tr><td><b>'+esc(s.full_name||"—")+'</b></td>' +
      '<td class="mono">'+esc(s.email)+'</td>' +
      '<td><span class="chip '+(s.role==="owner"?"v":"n")+'">'+esc(ROLES[s.role]||s.role)+'</span></td>' +
      '<td>'+(s.is_active?'<span class="chip g">نشط</span>':'<span class="chip d">موقوف</span>')+'</td>' +
      '</tr>';
  }).join("");

  shell('<div class="card"><div class="hd"><h2>الموظفون والصلاحيات</h2>' +
    '<span class="sub">'+list.length+' حساب</span></div><div class="bd">' +
    (rows ? '<div class="scroll"><table><tr><th>الاسم</th><th>البريد</th><th>الدور</th>' +
      '<th>الحالة</th></tr>'+rows+'</table></div>' : '<div class="empty">لا توجد حسابات</div>') +
    '</div></div>' +
    '<div class="card"><div class="hd"><h2>إضافة موظف أو تعديل دوره</h2></div><div class="bd">' +
    '<div class="note w">الموظف يجب أن يكون له حساب في Supabase أولاً:<br>' +
    'Authentication ← Users ← Add user ← مع تفعيل <b>Auto Confirm User</b>.<br>' +
    'ثم اكتب بريده هنا وحدّد دوره.</div>' +
    '<form id="sf" style="display:grid;gap:14px"><div class="grid2">' +
    '<div><label class="lbl" for="s_em">البريد الإلكتروني</label>' +
    '<input class="inp mono" id="s_em" type="email" required></div>' +
    '<div><label class="lbl" for="s_nm">الاسم</label><input class="inp" id="s_nm"></div>' +
    '<div><label class="lbl" for="s_rl">الدور</label><select class="inp" id="s_rl">' +
    '<option value="gate">بوابة — البوابة فقط</option>' +
    '<option value="staff" selected>موظف — البوابة والزوار والتسجيل السريع</option>' +
    '<option value="admin">مدير — كل شيء عدا إدارة الموظفين</option>' +
    '<option value="owner">مالك — كل الصلاحيات</option>' +
    '</select></div></div>' +
    '<label class="check"><input type="checkbox" id="s_act" checked> نشط</label>' +
    '<div><button class="btn" type="submit">حفظ</button></div></form></div></div>');

  $("#sf").onsubmit = async function(e){
    e.preventDefault();
    var r2 = await sb.rpc("set_staff", {
      p_email: $("#s_em").value.trim(),
      p_name:  $("#s_nm").value.trim() || null,
      p_role:  $("#s_rl").value,
      p_perms: {},
      p_active: $("#s_act").checked
    });
    var d2 = r2.data || {};
    if (d2.ok){ S.msg="تم الحفظ"; staffView(); }
    else { S.err = d2.error==="no_user" ? "لا يوجد حساب بهذا البريد — أنشئه في Authentication أولاً" :
           d2.error==="forbidden"  ? "المالك وحده يدير الموظفين" :
           d2.error==="last_owner" ? "لا يمكن تنزيل المالك الوحيد" : "تعذّر الحفظ"; staffView(); }
  };
}

// ===================== التوجيه =====================
function route(){
  if (S.tab==="overview") return overviewView();
  if (S.tab==="form")    return isAdmin() ? formView()  : gateView(null);
  if (S.tab==="badge")   return isAdmin() ? badgeView() : gateView(null);
  if (S.tab==="list")    return listView();
  if (S.tab==="quick")   return quickView();
  if (S.tab==="rep")     return repView();
  if (S.tab==="tickets") return isAdmin() ? ticketsView() : gateView(null);
  if (S.tab==="events")  return isAdmin() ? eventsView() : gateView(null);
  if (S.tab==="staff")   return isOwner() ? staffView()  : gateView(null);
  gateView(null);
}

async function loadEvents(){
  var r = await sb.rpc("list_events");
  var d = r.data || {};
  S.events = (d.ok && d.events) || [];
  if (!S.ev && S.events.length) S.ev = S.events[0].slug;
}

async function boot(){
  var ses = await sb.auth.getSession();
  if (!ses.data.session){ loginView(); return; }

  app.innerHTML = '<div class="loginwrap"><span class="spin"></span></div>';

  var uid = ses.data.session.user.id;
  var st  = await sb.from("staff").select("*").eq("user_id", uid).maybeSingle();

  if (!st.data || !st.data.is_active){
    app.innerHTML = '<div class="loginwrap"><div class="loginbox"><div class="card"><div class="bd">' +
      '<div class="note d">هذا الحساب غير مصرّح له بالدخول.</div>' +
      '<button class="btn ghost w" id="o2">خروج</button></div></div></div></div>';
    $("#o2").onclick = async function(){ await sb.auth.signOut(); location.reload(); };
    return;
  }

  S.me = ses.data.session.user;
  S.staff = st.data;
  await loadEvents();
  route();
}

boot();
</script>
</body>
</html>
